name: Check V2

on:
  pull_request:
    branches: [main, remaster]
  push:
    branches: [remaster, codex/remaster-v2]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify the committed browser bundle is current
        run: git diff --exit-code -- js/vendor/glass-object.js
